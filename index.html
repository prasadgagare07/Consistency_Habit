<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Consistency Fund</title>
<style>
  html, body, #root { margin: 0; padding: 0; min-height: 100vh; background: #062017; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ---------- tiny emoji-based icon components (replaces lucide-react) ---------- */
const Icon = (glyph) => ({ size = 16 }) => React.createElement("span", { style: { fontSize: size, lineHeight: 1, display: "inline-block" } }, glyph);
const Flame = Icon("🔥");
const Wallet = Icon("👛");
const CalendarDays = Icon("📅");
const IndianRupee = Icon("₹");
const Lock = Icon("🔒");
const Unlock = Icon("🔓");
const Target = Icon("🎯");

/* ---------- storage shim (replaces Claude's window.storage with localStorage) ---------- */
const storage = {
  get: async (key) => {
    const v = localStorage.getItem(key);
    return v !== null ? { key, value: v } : null;
  },
  set: async (key, value) => {
    localStorage.setItem(key, value);
    return { key, value };
  },
};

/* ---------- helpers ---------- */
const pad = (n) => String(n).padStart(2, "0");
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
};
const addDays = (dateStr, n) => {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
};
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
const fmtDate = (s) =>
  s ? new Date(s + "T00:00:00").toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) : "—";
const inr = (n) => (n < 0 ? "-₹" : "₹") + Math.round(Math.abs(n)).toLocaleString("en-IN", { maximumFractionDigits: 0 });

const STORAGE_KEY = "fund-streak:data";
const LOG_HOUR = 22; // 10 PM

const DEFAULT_STATE = {
  currentFund: 10000,
  dailyTarget: 5000,
  streakGoalDays: 10,
  startDate: null,
  logs: [],
};

/* ================= main component ================= */
function FundStreakTracker() {
  const [data, setData] = useState(DEFAULT_STATE);
  const [loaded, setLoaded] = useState(false);
  const [editing, setEditing] = useState(false);
  const [logAmount, setLogAmount] = useState("");
  const [now, setNow] = useState(new Date());
  const [previewFestive, setPreviewFestive] = useState(false);
  const petalHostRef = useRef(null);
  const crackerHostRef = useRef(null);
  const reducedMotion = useRef(
    typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches
  );

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get(STORAGE_KEY);
        if (res && res.value) setData(JSON.parse(res.value));
      } catch (e) {
        /* first run */
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 15000);
    return () => clearInterval(t);
  }, []);

  const persist = useCallback(async (next) => {
    setData(next);
    try {
      await storage.set(STORAGE_KEY, JSON.stringify(next));
    } catch (e) {
      console.error("save failed", e);
    }
  }, []);

  const sortedLogs = [...data.logs].sort((a, b) => (a.date < b.date ? -1 : 1));
  const loggedFund = sortedLogs.reduce((s, l) => s + Number(l.amount || 0), 0);

  let currentStreak = 0;
  if (sortedLogs.length) {
    const gapToToday = daysBetween(sortedLogs[sortedLogs.length - 1].date, todayStr());
    if (gapToToday <= 1) {
      currentStreak = 1;
      for (let i = sortedLogs.length - 1; i > 0; i--) {
        if (daysBetween(sortedLogs[i - 1].date, sortedLogs[i].date) === 1) currentStreak++;
        else break;
      }
    }
  }

  const lastLogDate = sortedLogs.length ? sortedLogs[sortedLogs.length - 1].date : null;
  const gapSinceLast = lastLogDate ? daysBetween(lastLogDate, todayStr()) : 0;
  const missedAtLeastOneDay = data.startDate && lastLogDate !== null && gapSinceLast >= 2;
  const missedFromStartWithNoLog =
    data.startDate && lastLogDate === null && daysBetween(data.startDate, todayStr()) >= 1;
  const isBroken = missedAtLeastOneDay || missedFromStartWithNoLog;

  const todayLog = data.logs.find((l) => l.date === todayStr());
  const loggedToday = !!todayLog;

  const lastLog = sortedLogs.length ? sortedLogs[sortedLogs.length - 1] : null;
  const lastLogAt = lastLog ? new Date(lastLog.loggedAt || `${lastLog.date}T12:00:00`) : null;
  const msSinceLastLog = lastLogAt ? now - lastLogAt : Infinity;
  const within24h = msSinceLastLog < 24 * 60 * 60 * 1000;
  const celebratingProfit = within24h && lastLog && Number(lastLog.amount) >= 0;
  const celebratingLoss = within24h && lastLog && Number(lastLog.amount) < 0;
  const hoursLeft = within24h ? Math.max(0, Math.ceil((24 * 60 * 60 * 1000 - msSinceLastLog) / (60 * 60 * 1000))) : 0;

  const remainingDays = Math.max(data.streakGoalDays - currentStreak, 0);
  const projectedFund = Number(data.currentFund || 0) + loggedFund + remainingDays * Number(data.dailyTarget || 0);

  const targetDate = data.startDate ? addDays(data.startDate, data.streakGoalDays - 1) : null;
  let completionValue = 0;
  if (data.startDate) {
    for (let i = 0; i < data.streakGoalDays; i++) {
      const dDate = addDays(data.startDate, i);
      const log = data.logs.find((l) => l.date === dDate);
      completionValue += log ? Number(log.amount) : Number(data.dailyTarget || 0);
    }
  } else {
    completionValue = data.streakGoalDays * Number(data.dailyTarget || 0);
  }

  const unlockDate = data.startDate ? addDays(data.startDate, data.streakGoalDays - 2) : null;
  const canEditConfig = !data.startDate || todayStr() >= unlockDate;

  const canLogNow = data.logs.length === 0 || now.getHours() >= LOG_HOUR;

  let mode = "green";
  if (isBroken) mode = "broken";
  else if (celebratingLoss) mode = "loss";

  useEffect(() => {
    if (mode !== "green" || reducedMotion.current) return;
    const host = petalHostRef.current;
    if (!host) return;
    const petals = ["🌿", "🍃", "🌸"];
    let alive = true;
    const spawn = () => {
      if (!alive) return;
      const el = document.createElement("span");
      el.textContent = petals[Math.floor(Math.random() * petals.length)];
      el.style.position = "absolute";
      el.style.left = Math.random() * 100 + "%";
      el.style.top = "-40px";
      el.style.fontSize = 14 + Math.random() * 16 + "px";
      el.style.opacity = 0.55 + Math.random() * 0.35;
      const dur = 7 + Math.random() * 6;
      el.style.animation = `petal-fall ${dur}s linear forwards`;
      host.appendChild(el);
      setTimeout(() => el.remove(), dur * 1000 + 100);
    };
    const interval = setInterval(spawn, 420);
    return () => {
      alive = false;
      clearInterval(interval);
    };
  }, [mode]);

  const showFestive = celebratingProfit || previewFestive;

  useEffect(() => {
    if (mode !== "green" || !showFestive || reducedMotion.current) return;
    const host = crackerHostRef.current;
    if (!host) return;
    let alive = true;
    const burst = () => {
      if (!alive) return;
      const colors = ["#FFB627", "#FF6B35", "#FFD23F", "#FF3E7F", "#8CFFDA", "#FFF"];
      const cx = 15 + Math.random() * 70;
      const cy = 10 + Math.random() * 40;
      for (let i = 0; i < 20; i++) {
        const p = document.createElement("span");
        const angle = (Math.PI * 2 * i) / 20;
        const dist = 55 + Math.random() * 65;
        p.style.position = "absolute";
        p.style.left = cx + "%";
        p.style.top = cy + "%";
        p.style.width = p.style.height = 5 + Math.random() * 4 + "px";
        p.style.borderRadius = "50%";
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.boxShadow = `0 0 8px ${colors[Math.floor(Math.random() * colors.length)]}`;
        p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
        p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
        p.style.animation = "cracker-burst 900ms ease-out forwards";
        host.appendChild(p);
        setTimeout(() => p.remove(), 950);
      }
    };
    burst();
    const interval = setInterval(burst, 18000);
    return () => {
      alive = false;
      clearInterval(interval);
    };
  }, [mode, showFestive]);

  useEffect(() => {
    if (mode === "green" || reducedMotion.current) return;
    const host = petalHostRef.current;
    if (!host) return;
    let alive = true;
    const spawn = () => {
      if (!alive) return;
      const el = document.createElement("span");
      el.textContent = Math.random() > 0.5 ? "🔥" : "💀";
      el.style.position = "absolute";
      el.style.left = Math.random() * 100 + "%";
      el.style.top = "-30px";
      el.style.fontSize = 12 + Math.random() * 14 + "px";
      el.style.opacity = 0.4 + Math.random() * 0.3;
      const dur = 6 + Math.random() * 5;
      el.style.animation = `petal-fall ${dur}s linear forwards`;
      host.appendChild(el);
      setTimeout(() => el.remove(), dur * 1000 + 100);
    };
    const interval = setInterval(spawn, 500);
    return () => {
      alive = false;
      clearInterval(interval);
    };
  }, [mode]);

  const handleLog = () => {
    if (!canLogNow || loggedToday) return;
    const amt = Number(logAmount);
    if (!amt && amt !== 0) return;
    const next = {
      ...data,
      logs: [
        ...data.logs.filter((l) => l.date !== todayStr()),
        { date: todayStr(), amount: amt, loggedAt: new Date().toISOString() },
      ],
    };
    persist(next);
    setLogAmount("");
  };

  const startChallenge = (cfg) => {
    persist({ ...data, ...cfg, startDate: cfg.startDate || todayStr(), logs: [] });
    setEditing(false);
  };

  const saveConfig = (cfg) => {
    persist({ ...data, ...cfg });
    setEditing(false);
  };

  if (!loaded) return null;

  return (
    <div style={{ fontFamily: "'Inter', sans-serif", minHeight: "100vh" }}>
      <style>{FONT_IMPORT}</style>
      <style>{GLOBAL_CSS}</style>

      {!data.startDate && !editing ? (
        <SetupView data={data} onStart={startChallenge} />
      ) : mode === "broken" ? (
        <RedRegretView
          data={data}
          remainingDays={remainingDays}
          projectedFund={projectedFund}
          gapSinceLast={gapSinceLast}
          logAmount={logAmount}
          setLogAmount={setLogAmount}
          canLogNow={canLogNow}
          onLog={handleLog}
          petalHostRef={petalHostRef}
        />
      ) : mode === "loss" ? (
        <LossPunishView
          data={data}
          lastLog={lastLog}
          hoursLeft={hoursLeft}
          projectedFund={projectedFund}
          remainingDays={remainingDays}
          petalHostRef={petalHostRef}
        />
      ) : (
        <GreenView
          data={data}
          currentStreak={currentStreak}
          remainingDays={remainingDays}
          loggedFund={loggedFund}
          projectedFund={projectedFund}
          completionValue={completionValue}
          targetDate={targetDate}
          loggedToday={loggedToday}
          showFestive={showFestive}
          hoursLeft={hoursLeft}
          previewFestive={previewFestive}
          setPreviewFestive={setPreviewFestive}
          canLogNow={canLogNow}
          logAmount={logAmount}
          setLogAmount={setLogAmount}
          onLog={handleLog}
          editing={editing}
          setEditing={setEditing}
          canEditConfig={canEditConfig}
          unlockDate={unlockDate}
          saveConfig={saveConfig}
          petalHostRef={petalHostRef}
          crackerHostRef={crackerHostRef}
        />
      )}
    </div>
  );
}

/* ================= SETUP (first run) ================= */
function SetupView({ data, onStart }) {
  const [currentFund, setCurrentFund] = useState(data.currentFund);
  const [dailyTarget, setDailyTarget] = useState(data.dailyTarget);
  const [streakGoalDays, setStreakGoalDays] = useState(data.streakGoalDays);
  const [startDate, setStartDate] = useState(todayStr());
  return (
    <div style={pageWrap("green")}>
      <div style={{ position: "relative", maxWidth: 420, margin: "60px auto", textAlign: "center" }}>
        <div style={{ fontSize: 44, marginBottom: 6 }}>🪔</div>
        <h1 style={{ fontFamily: "'Baloo 2', cursive", fontSize: 24, color: "#EFFFF4", margin: "0 0 4px" }}>
          Start your consistency streak
        </h1>
        <p style={{ fontSize: 13, color: "#9FE8BC", marginBottom: 20 }}>
          Set your numbers once — they lock until the day before your target date.
        </p>
        <div style={{ display: "flex", flexDirection: "column", gap: 10, textAlign: "left" }}>
          <Field label="Current fund (₹)" value={currentFund} setValue={setCurrentFund} />
          <Field label="Daily target (₹)" value={dailyTarget} setValue={setDailyTarget} />
          <Field label="Streak goal (days)" value={streakGoalDays} setValue={setStreakGoalDays} />
          <Field label="Start date" value={startDate} setValue={setStartDate} type="date" />
        </div>
        <button
          onClick={() =>
            onStart({
              currentFund: Number(currentFund),
              dailyTarget: Number(dailyTarget),
              streakGoalDays: Number(streakGoalDays),
              startDate,
            })
          }
          style={{ ...primaryBtn, justifyContent: "center", width: "100%", marginTop: 16 }}
        >
          <Flame size={16} /> Light the streak
        </button>
      </div>
    </div>
  );
}

/* ================= GREEN THEME (default dashboard) ================= */
function GreenView({
  data,
  currentStreak,
  remainingDays,
  loggedFund,
  projectedFund,
  completionValue,
  targetDate,
  loggedToday,
  showFestive,
  hoursLeft,
  previewFestive,
  setPreviewFestive,
  canLogNow,
  logAmount,
  setLogAmount,
  onLog,
  editing,
  setEditing,
  canEditConfig,
  unlockDate,
  saveConfig,
  petalHostRef,
  crackerHostRef,
}) {
  const ring = Math.min(currentStreak / Math.max(data.streakGoalDays, 1), 1);
  const circumference = 2 * Math.PI * 54;

  return (
    <div style={pageWrap("green")}>
      <div ref={petalHostRef} style={{ position: "absolute", inset: 0, pointerEvents: "none", overflow: "hidden" }} />
      {showFestive && <div ref={crackerHostRef} style={{ position: "absolute", inset: 0, pointerEvents: "none", overflow: "hidden", zIndex: 5 }} />}
      {showFestive && <FestiveAmbience />}

      <div style={{ position: "relative", maxWidth: 480, margin: "0 auto", zIndex: 6 }}>
        <div style={{ textAlign: "center", marginBottom: 22 }}>
          <div style={{ fontSize: 12, letterSpacing: 3, textTransform: "uppercase", color: "#7FE0AA" }}>
            Consistency Fund
          </div>
          <h1 style={{ fontFamily: "'Baloo 2', cursive", fontSize: 15, fontWeight: 400, color: "#B9F3CE", margin: "4px 0 0" }}>
            {showFestive ? "the flame is still burning bright" : "stay lit, day after day"}
          </h1>
        </div>

        <div style={{ display: "flex", justifyContent: "center", marginBottom: 18 }}>
          <div style={{ position: "relative", width: 152, height: 152 }}>
            <svg width="152" height="152" style={{ transform: "rotate(-90deg)" }}>
              <circle cx="76" cy="76" r="54" stroke="#0F3A2A" strokeWidth="10" fill="none" />
              <circle
                cx="76" cy="76" r="54" stroke="url(#flameGrad)" strokeWidth="10" fill="none" strokeLinecap="round"
                strokeDasharray={circumference}
                strokeDashoffset={circumference * (1 - ring)}
                style={{ transition: "stroke-dashoffset 700ms ease" }}
              />
              <defs>
                <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#FFD23F" />
                  <stop offset="100%" stopColor="#39FF88" />
                </linearGradient>
              </defs>
            </svg>
            <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
              <span style={{ fontSize: 26 }}>🪔</span>
              <span style={{ fontFamily: "'Baloo 2', cursive", fontSize: 26, fontWeight: 700 }}>{currentStreak}</span>
              <span style={{ fontSize: 11, color: "#7FE0AA" }}>day streak</span>
            </div>
          </div>
        </div>

        <div style={heroBox}>
          <div style={{ fontSize: 12, color: "#7FE0AA", marginBottom: 6 }}>Projected fund</div>
          <div style={{ fontFamily: "'Baloo 2', cursive", fontSize: 40, fontWeight: 700, color: "#EFFFF4" }}>
            {inr(projectedFund)}
          </div>
          <div style={{ fontSize: 12, color: "#9FE8BC", marginTop: 4 }}>current + logged + (remaining × daily target)</div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
          <Stat icon={<Wallet size={16} />} label="Current fund" value={inr(data.currentFund)} />
          <Stat icon={<IndianRupee size={16} />} label="Logged fund" value={inr(loggedFund)} />
          <Stat icon={<CalendarDays size={16} />} label="Start date" value={fmtDate(data.startDate)} />
          <Stat icon={<CalendarDays size={16} />} label="Target date" value={fmtDate(targetDate)} />
        </div>

        <div style={{ marginBottom: 16 }}>
          <div
            style={{
              background: "linear-gradient(160deg, rgba(255,178,39,0.14), rgba(255,178,39,0.03))",
              border: "1px solid rgba(255,210,63,0.3)",
              borderRadius: 16,
              padding: "14px 16px",
            }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: 6, color: "#FFD23F", fontSize: 11 }}>
              <Target size={14} /> If you complete this streak
            </div>
            <div style={{ fontFamily: "'Baloo 2', cursive", fontSize: 24, fontWeight: 700, color: "#FFF3CF", marginTop: 2 }}>
              {inr(completionValue)}
            </div>
            <div style={{ fontSize: 11, color: "#F0D28B", marginTop: 2 }}>
              logged days count as-is, remaining days assumed at daily target
            </div>
          </div>
        </div>

        <div style={{ background: "rgba(6,32,23,0.6)", border: "1px solid rgba(127,224,170,0.2)", borderRadius: 16, padding: 16, marginBottom: 12 }}>
          {loggedToday ? (
            <div style={{ textAlign: "center", color: "#B9F3CE", fontSize: 14 }}>
              ✓ Today is logged ({inr(Number(data.logs.find((l) => l.date === todayStr())?.amount || 0))}).
              {showFestive ? ` The celebration keeps going for ${hoursLeft}h more.` : " Come back tomorrow after 10 PM."}
            </div>
          ) : canLogNow ? (
            <>
              <div style={{ fontSize: 12, color: "#7FE0AA", marginBottom: 8 }}>Log today's profit / loss</div>
              <div style={{ display: "flex", gap: 8 }}>
                <input
                  type="number"
                  value={logAmount}
                  onChange={(e) => setLogAmount(e.target.value)}
                  placeholder={`e.g. ${data.dailyTarget} or -1200 for a loss`}
                  style={inputStyle}
                />
                <button onClick={onLog} style={primaryBtn}>
                  <Flame size={16} /> Log
                </button>
              </div>
            </>
          ) : (
            <div style={{ textAlign: "center", color: "#7FE0AA", fontSize: 13, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
              <Lock size={16} />
              Logging opens at 10:00 PM today
            </div>
          )}
        </div>

        <div style={{ display: "flex", justifyContent: "center", gap: 16, flexWrap: "wrap" }}>
          <button
            onClick={() => setEditing((e) => !e)}
            style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", border: "none", color: "#7FE0AA", fontSize: 12, cursor: "pointer" }}
          >
            {canEditConfig ? <Unlock size={12} /> : <Lock size={12} />}
            {editing ? "close settings" : canEditConfig ? "edit fund / target / goal" : `locked until ${fmtDate(unlockDate)}`}
          </button>

          {!showFestive && (
            <button
              onClick={() => {
                setPreviewFestive(true);
                setTimeout(() => setPreviewFestive(false), 15000);
              }}
              disabled={previewFestive}
              style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", border: "none", color: previewFestive ? "#FFD23F" : "#7FE0AA", fontSize: 12, cursor: previewFestive ? "default" : "pointer" }}
            >
              🎬 {previewFestive ? "previewing… (15s)" : "preview celebration"}
            </button>
          )}
        </div>

        {editing && canEditConfig && <ConfigForm data={data} onSave={saveConfig} />}
        {editing && !canEditConfig && (
          <div style={{ marginTop: 10, textAlign: "center", fontSize: 12, color: "#FFB3B3" }}>
            Settings unlock one day before your target date ({fmtDate(unlockDate)}).
          </div>
        )}
      </div>
    </div>
  );
}

function FestiveAmbience() {
  return (
    <>
      <div style={fairyRow}>
        {Array.from({ length: 24 }).map((_, i) => (
          <span
            key={i}
            style={{
              width: 8,
              height: 8,
              borderRadius: "50%",
              background: ["#FFD23F", "#FF6B35", "#FF3E7F", "#8CFFDA"][i % 4],
              boxShadow: `0 0 8px ${["#FFD23F", "#FF6B35", "#FF3E7F", "#8CFFDA"][i % 4]}`,
              animation: `twinkle ${0.8 + (i % 5) * 0.15}s ease-in-out infinite alternate`,
              animationDelay: `${i * 0.05}s`,
            }}
          />
        ))}
      </div>
      <div style={{ position: "absolute", bottom: 10, left: 10, fontSize: 34, animation: "diya-flicker 1s infinite", zIndex: 5 }}>🪔</div>
      <div style={{ position: "absolute", bottom: 10, right: 10, fontSize: 34, animation: "diya-flicker 1.1s infinite", zIndex: 5 }}>🪔</div>
      <div style={{ position: "absolute", top: 40, left: 10, fontSize: 28, animation: "diya-flicker 0.9s infinite", zIndex: 5 }}>🪔</div>
      <div style={{ position: "absolute", top: 40, right: 10, fontSize: 28, animation: "diya-flicker 1.05s infinite", zIndex: 5 }}>🪔</div>
    </>
  );
}

function Stat({ icon, label, value }) {
  return (
    <div style={{ background: "rgba(6,32,23,0.55)", border: "1px solid rgba(127,224,170,0.18)", borderRadius: 14, padding: "12px 14px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, color: "#7FE0AA", fontSize: 11 }}>{icon} {label}</div>
      <div style={{ fontFamily: "'Baloo 2', cursive", fontSize: 16, fontWeight: 700, marginTop: 4 }}>{value}</div>
    </div>
  );
}

function ConfigForm({ data, onSave }) {
  const [currentFund, setCurrentFund] = useState(data.currentFund);
  const [dailyTarget, setDailyTarget] = useState(data.dailyTarget);
  const [streakGoalDays, setStreakGoalDays] = useState(data.streakGoalDays);
  return (
    <div style={{ marginTop: 12, background: "rgba(6,32,23,0.7)", border: "1px solid rgba(127,224,170,0.2)", borderRadius: 14, padding: 14, display: "flex", flexDirection: "column", gap: 8 }}>
      <Field label="Current fund (₹)" value={currentFund} setValue={setCurrentFund} />
      <Field label="Daily target (₹)" value={dailyTarget} setValue={setDailyTarget} />
      <Field label="Streak goal (days)" value={streakGoalDays} setValue={setStreakGoalDays} />
      <div style={{ fontSize: 11, color: "#7FE0AA" }}>Start date stays fixed at {fmtDate(data.startDate)}.</div>
      <button
        onClick={() => onSave({ currentFund: Number(currentFund), dailyTarget: Number(dailyTarget), streakGoalDays: Number(streakGoalDays) })}
        style={{ ...primaryBtn, justifyContent: "center", marginTop: 4 }}
      >
        Save
      </button>
    </div>
  );
}

function Field({ label, value, setValue, type = "number" }) {
  return (
    <label style={{ fontSize: 11, color: "#7FE0AA", display: "flex", flexDirection: "column", gap: 4 }}>
      {label}
      <input type={type} value={value} onChange={(e) => setValue(e.target.value)} style={inputStyle} />
    </label>
  );
}

function LossPunishView({ data, lastLog, hoursLeft, projectedFund, remainingDays, petalHostRef }) {
  const amt = Number(lastLog.amount);
  return (
    <div style={pageWrap("red")}>
      <div ref={petalHostRef} style={{ position: "absolute", inset: 0, pointerEvents: "none", overflow: "hidden" }} />
      <div style={{ position: "relative", maxWidth: 440, margin: "80px auto", textAlign: "center" }}>
        <div style={{ fontSize: 44, marginBottom: 6 }}>🕯️💨</div>
        <h1 style={{ fontFamily: "'Baloo 2', cursive", fontSize: 24, color: "#FFF", margin: "0 0 8px" }}>
          That day cost you {inr(Math.abs(amt))}
        </h1>
        <p style={{ fontSize: 13, color: "#FFC2C2", lineHeight: 1.6, margin: "0 0 18px" }}>
          The streak still counts — you showed up and logged it — but the diya burns red for a full 24 hours as a
          reminder that day went backwards, not forwards. {hoursLeft > 0 ? `${hoursLeft}h left.` : ""}
        </p>
        <div style={{ background: "rgba(0,0,0,0.35)", border: "1px solid rgba(255,120,120,0.35)", borderRadius: 16, padding: 16 }}>
          <div style={{ fontSize: 12, color: "#FFB3B3" }}>Projected fund still stands at</div>
          <div style={{ fontFamily: "'Baloo 2', cursive", fontSize: 30, fontWeight: 700, color: "#fff" }}>{inr(projectedFund)}</div>
          <div style={{ fontSize: 12, color: "#FFB3B3", marginTop: 6 }}>{remainingDays} days still needed</div>
        </div>
      </div>
    </div>
  );
}

function RedRegretView({ data, remainingDays, projectedFund, gapSinceLast, logAmount, setLogAmount, canLogNow, onLog, petalHostRef }) {
  const potentialProfit = data.streakGoalDays * Number(data.dailyTarget || 0);
  return (
    <div style={pageWrap("red")}>
      <div ref={petalHostRef} style={{ position: "absolute", inset: 0, pointerEvents: "none", overflow: "hidden" }} />
      <div style={{ position: "relative", maxWidth: 440, margin: "60px auto", textAlign: "center" }}>
        <div style={{ fontSize: 46, marginBottom: 6 }}>🕯️💨</div>
        <h1 style={{ fontFamily: "'Baloo 2', cursive", fontSize: 26, margin: "0 0 8px", color: "#FFF" }}>
          The streak went out.
        </h1>
        <p style={{ fontSize: 14, color: "#FFC2C2", lineHeight: 1.6, margin: "0 0 18px" }}>
          {gapSinceLast > 1 ? `${gapSinceLast - 1} day(s) went unlogged. ` : ""}
          On {inr(data.currentFund)}, {data.streakGoalDays} consistent days at {inr(data.dailyTarget)}/day were worth{" "}
          <b>{inr(potentialProfit)}</b>. A missed day resets the streak count — remaining days needed is now{" "}
          <b>{remainingDays}</b>, not less.
        </p>
        <div style={{ background: "rgba(0,0,0,0.35)", border: "1px solid rgba(255,120,120,0.35)", borderRadius: 16, padding: 16, marginBottom: 16 }}>
          <div style={{ fontSize: 12, color: "#FFB3B3" }}>Projected fund right now</div>
          <div style={{ fontFamily: "'Baloo 2', cursive", fontSize: 34, fontWeight: 700, color: "#fff" }}>{inr(projectedFund)}</div>
          <div style={{ fontSize: 12, color: "#FFB3B3", marginTop: 6 }}>Streak reset to 0 · {remainingDays} days still needed</div>
        </div>
        {canLogNow ? (
          <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
            <input
              type="number"
              value={logAmount}
              onChange={(e) => setLogAmount(e.target.value)}
              placeholder={`log today's profit/loss`}
              style={{ ...inputStyle, background: "rgba(0,0,0,0.4)", borderColor: "#FF7A7A", color: "#fff" }}
            />
            <button onClick={onLog} style={{ ...primaryBtn, background: "linear-gradient(135deg,#FF6B35,#FFB627)", color: "#3D0000" }}>
              🪔 Relight
            </button>
          </div>
        ) : (
          <div style={{ fontSize: 13, color: "#FFB3B3", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            <Lock size={14} /> Relighting opens at 10:00 PM
          </div>
        )}
        <div style={{ fontSize: 11, color: "#FF9B9B", marginTop: 6 }}>Don't let ₹ sit idle again — log the day it happens.</div>
      </div>
    </div>
  );
}

function pageWrap(mode) {
  return {
    position: "relative",
    minHeight: "100vh",
    overflow: "hidden",
    background:
      mode === "green"
        ? "radial-gradient(circle at 50% -10%, #175C42 0%, #0B3D2E 45%, #062017 100%)"
        : "radial-gradient(circle at 50% 0%, #6B0000 0%, #3D0000 55%, #1A0000 100%)",
    color: mode === "green" ? "#EAF7EF" : "#FFE3E3",
    padding: "32px 16px 60px",
    animation: mode === "red" ? "red-pulse 2.6s ease-in-out infinite" : "none",
  };
}

const heroBox = {
  background: "linear-gradient(160deg, rgba(57,255,136,0.10), rgba(57,255,136,0.02))",
  border: "1px solid rgba(127,224,170,0.25)",
  borderRadius: 20,
  padding: "22px 20px",
  textAlign: "center",
  marginBottom: 16,
};

const inputStyle = {
  flex: 1,
  padding: "10px 12px",
  borderRadius: 10,
  border: "1px solid rgba(127,224,170,0.3)",
  background: "rgba(6,32,23,0.5)",
  color: "#EAF7EF",
  fontSize: 14,
  outline: "none",
};

const primaryBtn = {
  display: "flex",
  alignItems: "center",
  gap: 6,
  padding: "10px 16px",
  borderRadius: 10,
  border: "none",
  background: "linear-gradient(135deg,#39FF88,#0FA968)",
  color: "#062017",
  fontWeight: 700,
  fontSize: 14,
  cursor: "pointer",
};

const fairyRow = { position: "absolute", top: 0, left: 0, right: 0, display: "flex", justifyContent: "space-around", padding: "14px 10px", zIndex: 5 };

const FONT_IMPORT = `@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Inter:wght@400;500;600&display=swap');`;

const GLOBAL_CSS = `
@keyframes petal-fall {
  0% { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(100vh) rotate(180deg); }
}
@keyframes cracker-burst {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
}
@keyframes twinkle {
  from { opacity: 0.35; transform: scale(0.85); }
  to { opacity: 1; transform: scale(1.15); }
}
@keyframes diya-flicker {
  0%,100% { filter: drop-shadow(0 0 6px #FFB627); transform: scale(1); }
  50% { filter: drop-shadow(0 0 14px #FF6B35); transform: scale(1.08); }
}
@keyframes red-pulse {
  0%,100% { filter: brightness(1); }
  50% { filter: brightness(1.15); }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}
`;

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<FundStreakTracker />);
</script>
</body>
</html>
