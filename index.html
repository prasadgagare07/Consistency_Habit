<script>
(function () {
  var h = React.createElement;
  var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef, useCallback = React.useCallback;

  /* ---------- tiny emoji-based icon components ---------- */
  function makeIcon(glyph) {
    return function (props) {
      var size = (props && props.size) || 16;
      return h("span", { style: { fontSize: size, lineHeight: 1, display: "inline-block" } }, glyph);
    };
  }
  var Flame = makeIcon("🔥");
  var Wallet = makeIcon("👛");
  var CalendarDays = makeIcon("📅");
  var IndianRupee = makeIcon("₹");
  var Lock = makeIcon("🔒");
  var Unlock = makeIcon("🔓");
  var Target = makeIcon("🎯");

  /* ---------- storage shim (localStorage instead of Claude's window.storage) ---------- */
  var storage = {
    get: function (key) {
      var v = localStorage.getItem(key);
      return Promise.resolve(v !== null ? { key: key, value: v } : null);
    },
    set: function (key, value) {
      localStorage.setItem(key, value);
      return Promise.resolve({ key: key, value: value });
    },
  };

  /* ---------- helpers ---------- */
  function pad(n) { return String(n).padStart(2, "0"); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function addDays(dateStr, n) {
    var d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function daysBetween(a, b) {
    return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
  }
  function fmtDate(s) {
    return s ? new Date(s + "T00:00:00").toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) : "—";
  }
  function inr(n) {
    return (n < 0 ? "-₹" : "₹") + Math.round(Math.abs(n)).toLocaleString("en-IN", { maximumFractionDigits: 0 });
  }

  var STORAGE_KEY = "fund-streak:data";
  var LOG_HOUR = 22; // 10 PM

  var DEFAULT_STATE = {
    currentFund: 10000,
    dailyTarget: 5000,
    streakGoalDays: 10,
    startDate: null,
    logs: [],

    deposits: [
      { date: "2026-07-24", time: "—", amount: 30000, status: "SUCCESS" },
      { date: "2026-08-06", time: "—", amount: 30000, status: "SUCCESS" },
      { date: "2026-08-20", time: "—", amount: 12000, status: "SUCCESS" },
    ],
    withdrawals: [
      { date: "2026-07-25", time: "—", amount: 4278, status: "SUCCESS" },
      { date: "2026-07-28", time: "—", amount: 1216, status: "SUCCESS" },
      { date: "2026-08-02", time: "—", amount: 7520, status: "SUCCESS" },
      { date: "2026-08-07", time: "—", amount: 16273, status: "SUCCESS" },
      { date: "2026-08-12", time: "—", amount: 2100, status: "SUCCESS" },
      { date: "2026-08-16", time: "—", amount: 1000, status: "SUCCESS" },
      { date: "2026-08-24", time: "—", amount: 17000, status: "SUCCESS" },
      { date: "2026-08-28", time: "—", amount: 8927, status: "SUCCESS" },
    ],

  var DEPOSIT_PASSCODE = "Krishna";
  var WITHDRAW_PASSCODE = "Radha";
  var VAULT_THRESHOLD = 5000; // profit above this per day goes to the surplus vault
  var WITHDRAWAL_METHODS = [
    { id: "upi", label: "UPI", icon: "📱" },
    { id: "bank", label: "Bank Account", icon: "🏦" },
    { id: "usdt", label: "USDT (TRC20)", icon: "₮" },
    { id: "tron", label: "TRON", icon: "🔺" },

  /* ---------- shared styles ---------- */
  function pageWrap(mode) {

    borderRadius: 20,
    padding: "22px 20px",
    textAlign: "center",
    marginBottom: 16,
  };
  var inputStyle = {
    flex: 1,
    padding: "10px 12px",
    borderRadius: 10,
    border: "1px solid rgba(127,224,170,0.3)",
    background: "rgba(6,32,23,0.5)",
    color: "#EAF7EF",
    fontSize: 14,
    outline: "none",
  };
  var primaryBtn = {
    display: "flex",
    alignItems: "center",
    gap: 6,
    padding: "10px 16px",
    borderRadius: 10,
    border: "none",
    background: "linear-gradient(135deg,#39FF88,#0FA968)",

    fontWeight: 700,
    fontSize: 14,
    cursor: "pointer",

    "@keyframes petal-fall { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(100vh) rotate(180deg); } }\n" +
    "@keyframes cracker-burst { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; } }\n" +
    "@keyframes twinkle { from { opacity: 0.35; transform: scale(0.85); } to { opacity: 1; transform: scale(1.15); } }\n" +
    "@keyframes diya-flicker { 0%,100% { filter: drop-shadow(0 0 6px #FFB627); transform: scale(1); } 50% { filter: drop-shadow(0 0 14px #FF6B35); transform: scale(1.08); } }\n" +
    "@keyframes red-pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.15); } }\n" +
    "@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }\n";

  // inject global CSS once, up front (plain <style>, no React needed for this)
  var styleTag = document.createElement("style");
  styleTag.textContent = GLOBAL_CSS_TEXT;
  document.head.appendChild(styleTag);

  /* ================= SETUP (first run) ================= */
  function SetupView(props) {
    var data = props.data, onStart = props.onStart;
    var s1 = useState(data.currentFund), currentFund = s1[0], setCurrentFund = s1[1];
    var s2 = useState(data.dailyTarget), dailyTarget = s2[0], setDailyTarget = s2[1];
    var s3 = useState(data.streakGoalDays), streakGoalDays = s3[0], setStreakGoalDays = s3[1];
    var s4 = useState(todayStr()), startDate = s4[0], setStartDate = s4[1];

        ),
        h(
          "div",

          h(
            "div",
            { style: { position: "relative", width: 152, height: 152 } },

              h("circle", {
                cx: 76, cy: 76, r: 54, stroke: "url(#flameGrad)", strokeWidth: 10, fill: "none", strokeLinecap: "round",
                strokeDasharray: circumference, strokeDashoffset: circumference * (1 - ring),
                style: { transition: "stroke-dashoffset 700ms ease" },
              }),
              h(
                "defs",
                null,
                h(
                  "linearGradient",

          h(Stat, { icon: h(CalendarDays, { size: 16 }), label: "Start date", value: fmtDate(data.startDate) }),
          h(Stat, { icon: h(CalendarDays, { size: 16 }), label: "Target date", value: fmtDate(targetDate) })
        ),
        h(
          "div",
          { style: { marginBottom: 16 } },
          h(
            "div",
            { style: { background: "linear-gradient(160deg, rgba(255,178,39,0.14), rgba(255,178,39,0.03))", border: "1px solid rgba(255,210,63,0.3)", borderRadius: 16, padding: "14px 16px" } },
            h("div", { style: { display: "flex", alignItems: "center", gap: 6, color: "#FFD23F", fontSize: 11 } }, h(Target, { size: 14 }), " If you complete this streak"),
            h("div", { style: { fontFamily: "'Baloo 2', cursive", fontSize: 24, fontWeight: 700, color: "#FFF3CF", marginTop: 2 } }, inr(completionValue)),
            h("div", { style: { fontSize: 11, color: "#F0D28B", marginTop: 2 } }, "logged days count as-is, remaining days assumed at daily target")
          )
        ),
        h(
          "div",
          { style: { background: "rgba(6,32,23,0.6)", border: "1px solid rgba(127,224,170,0.2)", borderRadius: 16, padding: 16, marginBottom: 12 } },
          loggedToday
            ? h(

                showFestive ? "The celebration keeps going for " + hoursLeft + "h more." : "Come back tomorrow after 10 PM."
              )
            : canLogNow
            ? h(
                React.Fragment,

                h("div", { style: { fontSize: 12, color: "#7FE0AA", marginBottom: 8 } }, "Log today's profit / loss"),

          style: {
            width: 8, height: 8, borderRadius: "50%",
            background: colors[i % 4],
            boxShadow: "0 0 8px " + colors[i % 4],
            animation: "twinkle " + (0.8 + (i % 5) * 0.15) + "s ease-in-out infinite alternate",
            animationDelay: (i * 0.05) + "s",
          },
        })
      );
    }
    return h(
      React.Fragment,
      null,
      h("div", { style: fairyRow }, dots),
      h("div", { style: { position: "absolute", bottom: 10, left: 10, fontSize: 34, animation: "diya-flicker 1s infinite", zIndex: 5 } }, "🪔"),

  function ConfigForm(props) {

    var s1 = useState(data.currentFund), currentFund = s1[0], setCurrentFund = s1[1];
    var s2 = useState(data.dailyTarget), dailyTarget = s2[0], setDailyTarget = s2[1];

  function FundsView(props) {
    var data = props.data, currentFundsOps = props.currentFundsOps, vaultBalance = props.vaultBalance,
      vaultReviewCount = props.vaultReviewCount, onBack = props.onBack, addDeposit = props.addDeposit,
      addWithdrawal = props.addWithdrawal, saveWithdrawalAccount = props.saveWithdrawalAccount;

    var s1 = useState(null), openForm = s1[0], setOpenForm = s1[1]; // 'deposit' | 'withdraw' | 'account' | null
    var s2 = useState(""), amount = s2[0], setAmount = s2[1];
    var s3 = useState(""), passcode = s3[0], setPasscode = s3[1];

      setEditing(false);
    }

    function saveConfig(cfg) {
      persist(Object.assign({}, data, cfg));
      setEditing(false);
    }

    /* ---------- money-ops: vault, deposits, withdrawals ---------- */
    var vaultBalance = 0;
    data.logs.forEach(function (l) {
      var amt = Number(l.amount || 0);
      if (amt > VAULT_THRESHOLD) vaultBalance += amt - VAULT_THRESHOLD;
    });
    var spendableProfit = loggedFund - vaultBalance; // profit minus whatever sat aside in the vault
    var totalDeposited = data.deposits.reduce(function (s, d) { return s + Number(d.amount || 0); }, 0);
    var totalWithdrawn = data.withdrawals.reduce(function (s, w) { return s + Number(w.amount || 0); }, 0);
    var currentFundsOps = totalDeposited + spendableProfit - totalWithdrawn;
    var vaultReviewCount = data.withdrawals.length % 15;

    function nowParts() {
      var d = new Date();
      var h = d.getHours(), m = d.getMinutes();
      var ampm = h >= 12 ? "pm" : "am";
      var h12 = h % 12; if (h12 === 0) h12 = 12;
      return { date: todayStr(), time: h12 + ":" + pad(m) + " " + ampm };
    }

    function addDeposit(amount, passcode) {
      if (passcode !== DEPOSIT_PASSCODE) return "Wrong passcode.";
      var amt = Number(amount);
      if (!amt || amt <= 0) return "Enter a valid amount.";
      var np = nowParts();
      persist(Object.assign({}, data, {
        deposits: data.deposits.concat([{ date: np.date, time: np.time, amount: amt, status: "SUCCESS" }]),
      }));
      return null;
    }

    function addWithdrawal(amount, passcode) {
      if (!data.withdrawalAccount) return "Set a withdrawal account first.";
      if (passcode !== WITHDRAW_PASSCODE) return "Wrong passcode.";
      var amt = Number(amount);
      if (!amt || amt <= 0) return "Enter a valid amount.";
      if (amt > currentFundsOps) return "That's more than your current funds.";
      var np = nowParts();
      persist(Object.assign({}, data, {
        withdrawals: data.withdrawals.concat([{ date: np.date, time: np.time, amount: amt, status: "SUCCESS" }]),
      }));
      return null;
    }

    function saveWithdrawalAccount(method, details, passcode) {
      if (passcode !== WITHDRAW_PASSCODE) return "Wrong passcode.";
      if (!method) return "Choose a method.";
      persist(Object.assign({}, data, { withdrawalAccount: { method: method, details: details || "" } }));
      return null;
    }

    if (!loaded) return null;

    var body;
    if (!data.startDate && !editing) {
      body = h(SetupView, { data: data, onStart: startChallenge });
    } else if (mode === "broken") {
      body = h(RedRegretView, {
        data: data, remainingDays: remainingDays, projectedFund: projectedFund, gapSinceLast: gapSinceLast,
        logAmount: logAmount, setLogAmount: setLogAmount, canLogNow: canLogNow, onLog: handleLog, petalHostRef: petalHostRef,
      });
    } else if (mode === "loss") {
      body = h(LossPunishView, {
        data: data, lastLog: lastLog, hoursLeft: hoursLeft, projectedFund: projectedFund,
        remainingDays: remainingDays, petalHostRef: petalHostRef,
      });
    } else if (showFunds) {
      body = h(FundsView, {
        data: data, currentFundsOps: currentFundsOps, spendableProfit: spendableProfit,
        vaultBalance: vaultBalance, vaultReviewCount: vaultReviewCount, onBack: function () { setShowFunds(false); },
        addDeposit: addDeposit, addWithdrawal: addWithdrawal, saveWithdrawalAccount: saveWithdrawalAccount,
      });
    } else {
      body = h(GreenView, {
        data: data, currentStreak: currentStreak, remainingDays: remainingDays, loggedFund: loggedFund,
        projectedFund: projectedFund, completionValue: completionValue, targetDate: targetDate, loggedToday: loggedToday,
        showFestive: showFestive, hoursLeft: hoursLeft, previewFestive: previewFestive, setPreviewFestive: setPreviewFestive,
        canLogNow: canLogNow, logAmount: logAmount, setLogAmount: setLogAmount, onLog: handleLog, editing: editing,
        setEditing: setEditing, canEditConfig: canEditConfig, unlockDate: unlockDate, saveConfig: saveConfig,
        petalHostRef: petalHostRef, crackerHostRef: crackerHostRef, onOpenFunds: function () { setShowFunds(true); },
      });
    }

    return h("div", { style: { fontFamily: "'Inter', sans-serif", minHeight: "100vh" } }, body);
  }

  try {
    var root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(h(FundStreakTracker));
  } catch (e) {
    document.getElementById("root").innerHTML =
      '<div style="color:#FFD2D2;background:#3D0000;font-family:monospace;font-size:12px;padding:20px;white-space:pre-wrap;">Render failed: ' +
      (e && e.message ? e.message : String(e)) + '</div>';
  }
})();
</script>
</body>
</html>
