<script>

  /* ---------- storage shim (localStorage instead of Claude's window.storage) ---------- */
  var storage = {
    get: function (key) {
      // Prefer Claude's real persistent artifact storage (survives across
      // render-link sessions) when this is running inside the Claude viewer.
      if (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function") {
        return window.storage.get(key, false)
          .then(function (res) { return res ? { key: key, value: res.value } : null; })
          .catch(function () { return localStorageGet(key); });
      }
      return localStorageGet(key);
    },
    set: function (key, value) {
      if (typeof window !== "undefined" && window.storage && typeof window.storage.set === "function") {
        return window.storage.set(key, value, false)
          .then(function (res) { return res ? { key: key, value: value } : localStorageSet(key, value); })
          .catch(function () { return localStorageSet(key, value); });
      }
      return localStorageSet(key, value);
    },
  };
  function localStorageGet(key) {
    try {
      var v = localStorage.getItem(key);
      return Promise.resolve(v !== null ? { key: key, value: v } : null);
    } catch (e) {
      return Promise.resolve(null);
    }
  }
  function localStorageSet(key, value) {
    try {
      localStorage.setItem(key, value);
      // read back immediately to confirm the write actually stuck (some
      // sandboxed/private-browsing contexts accept setItem silently but
      // don't persist it, or wipe it on the very next read)
      var check = localStorage.getItem(key);
      if (check !== value) return Promise.resolve(null);
      return Promise.resolve({ key: key, value: value });
    } catch (e) {
      return Promise.resolve(null);
    }
  }

  /* ---------- helpers ---------- */
  function pad(n) { return String(n).padStart(2, "0"); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function addDays(dateStr, n) {
    var d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function daysBetween(a, b) {
    return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
  }
  function fmtDate(s) {
    return s ? new Date(s + "T00:00:00").toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) : "—";
  }
  function inr(n) {
    return (n < 0 ? "-₹" : "₹") + Math.round(Math.abs(n)).toLocaleString("en-IN", { maximumFractionDigits: 0 });
  }

  /* ---------- deterministic daily-profit generator ----------
     Same date always produces the same number (stable across reloads,
     effectively a precomputed table without hand-typing 100 values).
     Range 2312–4123. Weekdays skew toward the low band (2312–3200) most
     of the time, occasionally the high band (3500–4123). Weekends are
     always kept in the low band. */
  function seededRandom(seedStr) {
    var h = 0;
    for (var i = 0; i < seedStr.length; i++) { h = (h * 31 + seedStr.charCodeAt(i)) >>> 0; }
    return (h % 100000) / 100000;
  }
  var LOW_MIN = 2312, LOW_MAX = 3200, HIGH_MIN = 3500, HIGH_MAX = 4123;
  function generateDailyProfit(dateStr) {
    var day = new Date(dateStr + "T00:00:00").getDay(); // 0 = Sun, 6 = Sat
    var isWeekend = day === 0 || day === 6;
    var rLow = seededRandom(dateStr + "-lo");
    if (isWeekend) return Math.round(LOW_MIN + rLow * (LOW_MAX - LOW_MIN));
    var pickHigh = seededRandom(dateStr + "-pick") > 0.75; // ~25% of weekdays land in the high band
    return pickHigh
      ? Math.round(HIGH_MIN + rLow * (HIGH_MAX - HIGH_MIN))
      : Math.round(LOW_MIN + rLow * (LOW_MAX - LOW_MIN));
  }
  /* fills in any day between startDate and "now" (inclusive of today only after 10pm)
     that doesn't already have a log; returns a new logs array, or null if nothing to add */
  function ensureAutoLogs(data, now) {
    if (!data.startDate) return null;
    var includeToday = now.getHours() >= LOG_HOUR;
    var lastNeeded = includeToday ? todayStr() : addDays(todayStr(), -1);
    if (data.startDate > lastNeeded) return null;
    var existing = {};
    data.logs.forEach(function (l) { existing[l.date] = true; });
    var additions = [];
    var cursor = data.startDate;
    var guard = 0;
    while (cursor <= lastNeeded && guard < 2000) {
      if (!existing[cursor]) {
        additions.push({ date: cursor, amount: generateDailyProfit(cursor), loggedAt: cursor + "T16:30:00.000Z", auto: true });
      }
      cursor = addDays(cursor, 1);
      guard++;
    }
    return additions.length ? data.logs.concat(additions) : null;
  }

  var STORAGE_KEY = "fund-streak:data";
  var LOG_HOUR = 22; // 10 PM
  var FIXED_DAILY_TARGET = 3000; // not user-editable
  var FIXED_CAPITAL = 12000;

  /* ---------- withdrawal amounts derived from the daily-profit generator ----------
     Each withdrawal's amount is the sum of every day's generated profit from the
     PREVIOUS withdrawal's date (or the streak's start date, for the first
     withdrawal) up to the day BEFORE the withdrawal's own date. That block of
     days is then "swept" into the withdrawal amount, and the next period starts
     fresh from the withdrawal's own date. Dates/times/status are fixed; only the
     amount is computed. */
  var WITHDRAWAL_TEMPLATE = [
    { date: "2026-07-25", time: "08:15 am", status: "SUCCESS" },
    { date: "2026-07-28", time: "12:23 pm", status: "SUCCESS" },
    { date: "2026-08-02", time: "09:12 am", status: "SUCCESS" },
    { date: "2026-08-07", time: "04:54 pm", status: "SUCCESS" },
    { date: "2026-08-12", time: "09:23 am", status: "SUCCESS" },
    { date: "2026-08-16", time: "01:14 pm", status: "SUCCESS" },
    { date: "2026-08-24", time: "04:32 am", status: "SUCCESS" },
    { date: "2026-08-28", time: "06:30 pm", status: "SUCCESS" },
  ];
  function sumGeneratedProfitRange(startD, endD) {
    // inclusive on both ends
    if (!startD || !endD || startD > endD) return 0;
    var sum = 0;
    var cursor = startD;
    var guard = 0;
    while (cursor <= endD && guard < 3000) {
      sum += generateDailyProfit(cursor);
      cursor = addDays(cursor, 1);
      guard++;
    }
    return sum;
  }
  function buildWithdrawalsFromTemplate(template, startDate) {
    var sorted = template.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var result = [];
    var periodStart = startDate;
    for (var i = 0; i < sorted.length; i++) {
      var w = sorted[i];
      var periodEnd = addDays(w.date, -1);
      var amount = sumGeneratedProfitRange(periodStart, periodEnd);
      result.push({ date: w.date, time: w.time, amount: amount, status: w.status, type: "profit" });
      periodStart = w.date; // next period picks up from this withdrawal's own date
    }
    return result;
  }

  /* ---------- cash withdrawals ----------
     These pull from the deposited capital itself (capital + deposits), not from
     swept daily profit, so they're tracked and totalled completely separately
     from the profit withdrawals above. */
  var CASH_WITHDRAWAL_TEMPLATE = [

    { date: "2026-08-16", time: "09:11 pm", amount: 30000, status: "SUCCESS", type: "cash" },

    { date: "2026-08-30", time: "09:00 pm", amount: 40000, status: "SUCCESS", type: "cash" },

  /* Profit withdrawals entered manually (not derived from the daily-profit

  var MANUAL_PROFIT_WITHDRAWAL_TEMPLATE = [
    { date: "2026-08-30", time: "09:10 pm", amount: 8454, status: "SUCCESS", type: "profit" },

  /* A deposit that happened but is intentionally not shown as a separate line

  var DEFAULT_STATE = {

    deposits: [

      { date: "2026-08-06", time: "02:19 pm", amount: 30000, status: "SUCCESS" },
      { date: "2026-08-20", time: "07:00 pm", amount: 12000, status: "SUCCESS" },
      { date: "2026-08-31", time: "10:48 am", amount: 19000, status: "SUCCESS" },

    ],
    withdrawals: buildWithdrawalsFromTemplate(WITHDRAWAL_TEMPLATE, "2026-07-24").concat(CASH_WITHDRAWAL_TEMPLATE).concat(MANUAL_PROFIT_WITHDRAWAL_TEMPLATE),

  var DEPOSIT_PASSCODE = "Krishna";
  var WITHDRAW_PASSCODE = "Radha";
  /* ---------- app-level pattern lock ----------

     Change PATTERN_LOCK_SEQUENCE below to set your own unlock pattern

  var PATTERN_LOCK_SEQUENCE = [9, 8, 5, 2, 3, 6];
  var VAULT_THRESHOLD = 5000; // profit above this per day goes to the surplus vault
  var WITHDRAWAL_METHODS = [
    { id: "upi", label: "UPI", icon: "📱" },
    { id: "bank", label: "Bank Account", icon: "🏦" },
    { id: "usdt", label: "USDT (TRC20)", icon: "₮" },

  /* ---------- shared styles ---------- */

  }
  var heroBox = {

    border: "1px solid rgba(127,224,170,0.25)",
    borderRadius: 20,

  };
  var inputStyle = {

    borderRadius: 10,
    border: "1px solid rgba(127,224,170,0.3)",
    background: "rgba(6,32,23,0.5)",

  var primaryBtn = {

  var GLOBAL_CSS_TEXT =
    "@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Inter:wght@400;500;600&display=swap');\n" +
    "@keyframes petal-fall { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(100vh) rotate(180deg); } }\n" +

    "@keyframes twinkle { from { opacity: 0.35; transform: scale(0.85); } to { opacity: 1; transform: scale(1.15); } }\n" +
    "@keyframes diya-flicker { 0%,100% { filter: drop-shadow(0 0 6px #FFB627); transform: scale(1); } 50% { filter: drop-shadow(0 0 14px #FF6B35); transform: scale(1.08); } }\n" +

  // inject global CSS once, up front (plain <style>, no React needed for this)
  var styleTag = document.createElement("style");
  styleTag.textContent = GLOBAL_CSS_TEXT;
  document.head.appendChild(styleTag);

  /* ================= PATTERN LOCK (gates the whole page) ================= */
  var LOCK_DOTS = [
    { id: 1, cx: 60, cy: 60 }, { id: 2, cx: 150, cy: 60 }, { id: 3, cx: 240, cy: 60 },
    { id: 4, cx: 60, cy: 150 }, { id: 5, cx: 150, cy: 150 }, { id: 6, cx: 240, cy: 150 },
    { id: 7, cx: 60, cy: 240 }, { id: 8, cx: 150, cy: 240 }, { id: 9, cx: 240, cy: 240 },
  ];
  function dotById(id) { return LOCK_DOTS.find(function (d) { return d.id === id; }); }

  function PatternLockView(props) {
    var onUnlock = props.onUnlock;
    var s1 = useState([]), path = s1[0], setPath = s1[1];
    var s2 = useState(false), dragging = s2[0], setDragging = s2[1];
    var s3 = useState(null), cursorPt = s3[0], setCursorPt = s3[1];
    var s4 = useState(false), showError = s4[0], setShowError = s4[1];
    var svgRef = useRef(null);
    var pathRef = useRef([]);
    pathRef.current = path;

    function svgPoint(evt) {
      var svg = svgRef.current;
      if (!svg) return null;
      var rect = svg.getBoundingClientRect();
      var x = ((evt.clientX - rect.left) / rect.width) * 300;
      var y = ((evt.clientY - rect.top) / rect.height) * 300;
      return { x: x, y: y };
    }

    function startAt(dotId, evt) {
      if (evt && evt.preventDefault) evt.preventDefault();
      setShowError(false);
      setDragging(true);
      setPath([dotId]);
    }

    function enterDot(dotId) {
      if (!dragging) return;
      if (pathRef.current.indexOf(dotId) === -1) {
        setPath(pathRef.current.concat(dotId));
      }
    }

    function finish() {
      if (!dragging) return;
      setDragging(false);
      var entered = pathRef.current;
      var ok = entered.length === PATTERN_LOCK_SEQUENCE.length &&
        entered.every(function (id, i) { return id === PATTERN_LOCK_SEQUENCE[i]; });
      if (ok) {
        onUnlock();
      } else if (entered.length > 0) {
        setShowError(true);
        setTimeout(function () { setPath([]); setShowError(false); }, 550);
      } else {
        setPath([]);
      }
    }

    useEffect(function () {
      function onMove(evt) {
        if (!dragging) return;
        var pt = svgPoint(evt.touches ? evt.touches[0] : evt);
        if (pt) setCursorPt(pt);
        var clientPt = evt.touches ? evt.touches[0] : evt;
        var el = document.elementFromPoint(clientPt.clientX, clientPt.clientY);
        if (el && el.getAttribute) {
          var dotAttr = el.getAttribute("data-dot");
          if (dotAttr) enterDot(Number(dotAttr));
        }
      }
      function onUp() { finish(); }
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("touchmove", onMove, { passive: false });
      window.addEventListener("touchend", onUp);
      return function () {
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("touchmove", onMove);
        window.removeEventListener("touchend", onUp);
      };
    }, [dragging]);

    var lineColor = showError ? "#FF6B6B" : "#39FF88";
    var dotColor = showError ? "#FF6B6B" : "#39FF88";

    var lines = [];
    for (var i = 0; i < path.length - 1; i++) {
      var a = dotById(path[i]), b = dotById(path[i + 1]);
      lines.push(h("line", { key: "l" + i, x1: a.cx, y1: a.cy, x2: b.cx, y2: b.cy, stroke: lineColor, strokeWidth: 6, strokeLinecap: "round" }));
    }
    if (dragging && path.length && cursorPt) {
      var last = dotById(path[path.length - 1]);
      lines.push(h("line", { key: "l-live", x1: last.cx, y1: last.cy, x2: cursorPt.x, y2: cursorPt.y, stroke: lineColor, strokeWidth: 6, strokeLinecap: "round", opacity: 0.6 }));
    }

    return h(
      "div",
      { style: pageWrap("green") },
      h(
        "div",
        {
          style: {
            position: "relative", maxWidth: 360, margin: "70px auto", textAlign: "center",

        },
        h("div", { style: { fontSize: 40, marginBottom: 6 } }, "🔒"),
        h("h1", { style: { fontFamily: "'Baloo 2', cursive", fontSize: 22, color: "#EFFFF4", margin: "0 0 4px" } }, "Draw your pattern"),
        h(
          "p",

        ),
        h(
          "svg",
          {
            ref: svgRef, viewBox: "0 0 300 300", width: "100%", style: { maxWidth: 300, touchAction: "none", userSelect: "none" },
            onPointerUp: finish,
          },
          lines,
          LOCK_DOTS.map(function (d) {
            var active = path.indexOf(d.id) !== -1;
            return h(
              "g",
              { key: d.id },
              h("circle", {
                cx: d.cx, cy: d.cy, r: 26, fill: "transparent", "data-dot": d.id,

                onPointerEnter: function () { enterDot(d.id); },
                style: { cursor: "pointer" },
              }),
              h("circle", {

                stroke: "rgba(127,224,170,0.5)", strokeWidth: active ? 0 : 1.5,
                style: { transition: "r 120ms ease, fill 120ms ease", pointerEvents: "none" },
              })
            );
          })

      )
    );
  }

  /* ================= ALGO ENGINE STATUS (always-on, independent of streak) ================= */
  var ALGO_TICKER_MESSAGES = [
    "Scanning BTC options chain for skew anomalies…",
    "Evaluating IV surface across near-dated expiries…",
    "Signal confirmed — sizing position within risk band…",
    "Routing order via low-latency execution node…",
    "Monitoring open gamma exposure…",

  function AlgoEngineStatus(props) {
    var startDate = props.startDate;
    var s1 = useState(new Date()), tick = s1[0], setTick = s1[1];
    var s2 = useState(null), btcPrice = s2[0], setBtcPrice = s2[1];
    var s3 = useState(null), btcChange = s3[0], setBtcChange = s3[1];
    var s4 = useState(0), tickerIdx = s4[0], setTickerIdx = s4[1];
    var s5 = useState(38), latency = s5[0], setLatency = s5[1];

    useEffect(function () {
      var t = setInterval(function () { setTick(new Date()); }, 1000);
      return function () { clearInterval(t); };
    }, []);

    useEffect(function () {
      var t = setInterval(function () {
        setTickerIdx(function (i) { return (i + 1) % ALGO_TICKER_MESSAGES.length; });
        setLatency(28 + Math.floor(Math.random() * 34));
      }, 3200);
      return function () { clearInterval(t); };
    }, []);

    useEffect(function () {
      var cancelled = false;
      function fetchPrice() {
        fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true")
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (cancelled) return;
            if (d && d.bitcoin) {
              setBtcPrice(d.bitcoin.usd);
              setBtcChange(d.bitcoin.usd_24h_change);
            }

        return "Fill in account number, bank name, IFSC code, and receiver name.";
      }
      if ((method === "usdt" || method === "tron") && !fields.walletAddress) return "Enter a wallet address.";
      persist(Object.assign({}, data, { withdrawalAccount: { method: method, fields: fields } }));
      return null;
    }

    function exportBackup() {
      try {
        var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "consistency-fund-backup-" + todayStr() + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        return null;
      } catch (e) {
        return "Export failed on this device.";
      }
    }

    function restoreBackup(fileObj, cb) {
      try {
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var parsed = JSON.parse(reader.result);
            persist(Object.assign({}, DEFAULT_STATE, parsed));
            cb(null);
          } catch (e) {
            cb("That file doesn't look like a valid backup.");
          }
        };
        reader.onerror = function () { cb("Couldn't read that file."); };
        reader.readAsText(fileObj);
      } catch (e) {
        cb("Restore failed on this device.");
      }
    }

    if (!unlocked) return h(PatternLockView, { onUnlock: function () { setUnlocked(true); } });
    if (!booted) return h(BootSequenceView, { onDone: function () { setBooted(true); } });
    if (!loaded) return null;

    var body;
    if (!data.startDate && !editing) {
      body = h(SetupView, { data: data, onStart: startChallenge });
    } else if (mode === "broken") {
      body = h(RedRegretView, {
        data: data, remainingDays: remainingDays, projectedFund: projectedFund, gapSinceLast: gapSinceLast,
        logAmount: logAmount, setLogAmount: setLogAmount, canLogNow: canLogNow, onLog: handleLog, petalHostRef: petalHostRef,
      });
    } else if (mode === "loss") {
      body = h(LossPunishView, {
        data: data, lastLog: lastLog, hoursLeft: hoursLeft, projectedFund: projectedFund,
        remainingDays: remainingDays, petalHostRef: petalHostRef,
      });
    } else if (showFunds) {
      body = h(FundsView, {
        data: data, currentFundsOps: currentFundsOps, totalProfitLogged: totalProfitLogged, estimate100: estimate100,
        vaultBalance: vaultBalance, vaultReviewCount: vaultReviewCount, onBack: function () { setShowFunds(false); },
        addDeposit: addDeposit, addWithdrawal: addWithdrawal, saveWithdrawalAccount: saveWithdrawalAccount,
        totalCashWithdrawn: totalCashWithdrawn, totalProfitWithdrawn: totalProfitWithdrawn,
        cashWithdrawals: cashWithdrawals, profitWithdrawals: profitWithdrawals,
        lastSavedAt: lastSavedAt, storageBroken: storageBroken, exportBackup: exportBackup, restoreBackup: restoreBackup,
        refreshFromStorage: refreshFromStorage, syncing: syncing,
      });
    } else if (showCalendar) {
      body = h(CalendarView, { data: data, targetDate: targetDate, onBack: function () { setShowCalendar(false); } });
    } else {
      body = h(GreenView, {
        data: data, currentStreak: currentStreak, remainingDays: remainingDays, loggedFund: loggedFund,
        projectedFund: projectedFund, completionValue: completionValue, targetDate: targetDate, loggedToday: loggedToday,
        showFestive: showFestive, hoursLeft: hoursLeft, previewFestive: previewFestive, setPreviewFestive: setPreviewFestive,
        canLogNow: canLogNow, logAmount: logAmount, setLogAmount: setLogAmount, onLog: handleLog, editing: editing,
        setEditing: setEditing, canEditConfig: canEditConfig, unlockDate: unlockDate, saveConfig: saveConfig,
        petalHostRef: petalHostRef, crackerHostRef: crackerHostRef, onOpenFunds: function () { setShowFunds(true); },
        onOpenCalendar: function () { setShowCalendar(true); },
      });
    }

    return h("div", { style: { fontFamily: "'Inter', sans-serif", minHeight: "100vh" } }, body);
  }

  try {
    var root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(h(FundStreakTracker));
  } catch (e) {
    document.getElementById("root").innerHTML =
      '<div style="color:#FFD2D2;background:#3D0000;font-family:monospace;font-size:12px;padding:20px;white-space:pre-wrap;">Render failed: ' +
      (e && e.message ? e.message : String(e)) + '</div>';
  }
})();
</script>
</body>
</html>
